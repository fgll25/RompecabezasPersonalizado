<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rompecabezas Personalizado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .piece { cursor: grab; transition: transform 0.2s; border: 0.5px solid rgba(255,255,255,0.3); }
        .piece:active { cursor: grabbing; }
        #board { display: grid; gap: 0px; border: 2px solid #333; background: #ddd; max-width: 90vw; margin: auto; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 flex flex-col items-center">
    <h1 class="text-3xl font-bold mb-6 text-gray-800">Rompecabezas Personalizado</h1>
    
    <div class="bg-white p-6 rounded-lg shadow-md w-full max-w-3xl mb-6">
        <div class="flex flex-wrap gap-4 items-center justify-center">
            <input type="file" id="imageInput" accept="image/*" class="text-sm text-gray-500">
            <div class="flex items-center gap-2">
                <label for="piecesInput" class="text-sm">Piezas (NxN):</label>
                <input type="number" id="piecesInput" value="3" min="2" max="108" class="border rounded px-2 py-1 w-16">
            </div>
            <button id="startBtn" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">Generar</button>
        </div>
    </div>

    <div id="board" class="shadow-xl"></div>
    <div id="message" class="mt-4 text-xl font-bold text-green-600"></div>

    <script>
        const board = document.getElementById('board');
        const imageInput = document.getElementById('imageInput');
        const piecesInput = document.getElementById('piecesInput');
        const startBtn = document.getElementById('startBtn');
        const message = document.getElementById('message');

        startBtn.addEventListener('click', () => {
            const file = imageInput.files[0];
            const size = parseInt(piecesInput.value);
            message.textContent = '';

            if (!file) return alert("Por favor, sube una imagen primero.");
            if (size < 2 || size > 108) return alert("El número de piezas debe estar entre 2 y 108.");
            
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => createPuzzle(e.target.result, size);
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });

        function createPuzzle(imageSrc, size) {
            board.innerHTML = '';
            board.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
            
            const containerSize = Math.min(window.innerWidth * 0.8, 600);
            const pieceSize = containerSize / size;
            
            let indices = Array.from({length: size * size}, (_, i) => i);
            indices.sort(() => Math.random() - 0.5); 
            
            indices.forEach(idx => {
                const r = Math.floor(idx / size);
                const c = idx % size;
                
                const div = document.createElement('div');
                div.className = 'piece';
                div.style.width = `${pieceSize}px`;
                div.style.height = `${pieceSize}px`;
                div.style.backgroundImage = `url(${imageSrc})`;
                div.style.backgroundSize = `${containerSize}px ${containerSize}px`;
                div.style.backgroundPosition = `-${c * pieceSize}px -${r * pieceSize}px`;
                div.draggable = true;
                div.dataset.correct = `${r}-${c}`;
                
                div.addEventListener('dragstart', e => e.dataTransfer.setData('text/id', div.id));
                div.addEventListener('dragover', e => e.preventDefault());
                div.addEventListener('drop', handleDrop);
                div.id = 'p-' + Math.random().toString(36).substr(2, 9);
                
                board.appendChild(div);
            });
        }

        function handleDrop(e) {
            const sourceId = e.dataTransfer.getData('text/id');
            const target = e.target;
            const source = document.getElementById(sourceId);
            
            if (target.classList.contains('piece') && source !== target) {
                const tempBg = source.style.backgroundPosition;
                const tempCorrect = source.dataset.correct;
                
                source.style.backgroundPosition = target.style.backgroundPosition;
                source.dataset.correct = target.dataset.correct;
                
                target.style.backgroundPosition = tempBg;
                target.dataset.correct = tempCorrect;
                
                checkWin();
            }
        }

        function checkWin() {
            const pieces = document.querySelectorAll('.piece');
            const size = Math.sqrt(pieces.length);
            let win = true;
            pieces.forEach((p, idx) => {
                const r = Math.floor(idx / size);
                const c = idx % size;
                if (p.dataset.correct !== `${r}-${c}`) win = false;
            });
            if (win) message.textContent = '¡Felicidades! ¡Has completado el rompecabezas!';
        }
    </script>
</body>
</html>
